if 'python' not in config.available_features:
    config.unsupported = True

# Convenience substitution for the directory containing lldb_bridge.so.
config.substitutions.append(('%ibid_lib_dir', config.llvm_shlib_dir))

# On macOS, LLDB stops at exec before the Python interpreter runs (stop-on-exec
# defaults to true). Inject the setting into every test's %lldb invocation so
# the suite behaves the same as on Linux.
import re, sys
if sys.platform == 'darwin':
    for i, (key, val) in enumerate(config.substitutions):
        if re.match(key, '%lldb'):
            config.substitutions[i] = (
                key, val + ' -o "settings set target.process.stop-on-exec false"')
            break
